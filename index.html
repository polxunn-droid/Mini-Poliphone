<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니폴리폰 보호 본문 업로더</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 18px; background: #f4f6f8; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    .card { max-width: 620px; margin: 0 auto; padding: 28px; background: white; border-radius: 18px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { color: #586474; line-height: 1.65; }
    input { width: 100%; margin: 16px 0; padding: 14px; border: 1px solid #cfd6df; border-radius: 10px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #1e3a5f; color: white; font-size: 16px; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .info { margin-top: 18px; padding: 14px; background: #f2f5f8; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ok { color: #147a45; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <main class="card">
    <h1>보호 본문 업로드</h1>
    <p>수정된 보호 본문 <b>mini-poliphone-google-link.html</b>을 선택하면 Firebase에 안전한 크기로 나누어 저장합니다.</p>
    <div id="authInfo" class="info">Firebase 로그인 확인 중…</div>
    <input id="fileInput" type="file" accept=".html,text/html" disabled>
    <button id="uploadBtn" type="button" disabled>Firebase에 본문 올리기</button>
    <div id="status" class="info">파일을 선택해주세요.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const ALLOWED_UPLOADER_UID = "7MIr0cptGhOVF6qAWT0t0CC6Qi93";
    const CHUNK_SIZE = 450000;

    const firebaseConfig = {
      apiKey: "AIzaSyDCzZK9zYugnBpBIcZZmfmFt5Mt4vlRQEE",
      authDomain: "mini-poliphone.firebaseapp.com",
      projectId: "mini-poliphone",
      storageBucket: "mini-poliphone.firebasestorage.app",
      messagingSenderId: "1044994708052",
      appId: "1:1044994708052:web:6df7a5bdfd23bbf91153c1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const authInfo = document.getElementById("authInfo");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    let ready = false;

    function bytesToBase64(bytes) {
      let binary = "";
      const step = 32768;
      for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode(...bytes.subarray(i, i + step));
      }
      return btoa(binary);
    }

    function updateButton() {
      uploadBtn.disabled = !(ready && fileInput.files && fileInput.files[0]);
    }

    try {
      await auth.authStateReady();
      const user = auth.currentUser || (await signInAnonymously(auth)).user;
      authInfo.textContent = "현재 UID: " + user.uid;

      if (user.uid !== ALLOWED_UPLOADER_UID) {
        authInfo.className = "info error";
        authInfo.textContent += "\n\n업로드 권한 UID와 일치하지 않습니다. 이 브라우저에서는 업로드하지 마세요.";
      } else {
        ready = true;
        fileInput.disabled = false;
        authInfo.className = "info ok";
        authInfo.textContent += "\n\n업로드 권한 확인 완료";
      }
    } catch (error) {
      authInfo.className = "info error";
      authInfo.textContent = "Firebase 로그인 실패: " + (error.code || error.message || error);
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      status.className = "info";
      status.textContent = file
        ? `선택된 파일: ${file.name}\n크기: ${file.size.toLocaleString()} bytes`
        : "파일을 선택해주세요.";
      updateButton();
    });

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!ready || !file) return;

      const confirmed = confirm(
        "선택한 HTML 파일을 Firebase 보호 영역에 올릴까요?\n\n" +
        file.name + "\n" + file.size.toLocaleString() + " bytes"
      );
      if (!confirmed) return;

      uploadBtn.disabled = true;
      fileInput.disabled = true;

      try {
        const allBytes = new Uint8Array(await file.arrayBuffer());
        const chunkCount = Math.ceil(allBytes.length / CHUNK_SIZE);

        for (let i = 0; i < chunkCount; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, allBytes.length);
          const chunk = allBytes.subarray(start, end);
          status.textContent = `업로드 중… ${i + 1} / ${chunkCount}`;

          await setDoc(
            doc(db, "protected_content", "app_" + String(i).padStart(4, "0")),
            {
              index: i,
              byteLength: chunk.length,
              data: bytesToBase64(chunk),
              updatedAt: serverTimestamp()
            }
          );
        }

        await setDoc(doc(db, "protected_content", "app_manifest"), {
          chunkCount,
          totalBytes: allBytes.length,
          chunkSize: CHUNK_SIZE,
          format: "base64-bytes-v1",
          sourceName: file.name,
          uploadedAt: serverTimestamp()
        });

        status.className = "info ok";
        status.textContent =
          `업로드 완료\n${chunkCount}개 조각\n총 ${allBytes.length.toLocaleString()} bytes`;
      } catch (error) {
        console.error(error);
        status.className = "info error";
        status.textContent = "업로드 실패\n" + (error.code || error.message || error);
        fileInput.disabled = false;
        updateButton();
      }
    });
  </script>
</body>
</html>
